name: Dependabot auto-rebase

on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Comment @dependabot rebase on open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" \
            --search 'author:app/dependabot is:open' \
            --json number --jq '.[].number' \
          | while read -r pr; do
              echo "Triggering rebase on PR #$pr"
              gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
            done
